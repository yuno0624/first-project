<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>銀魂式ネタ帳：思考ツリー＆発想マインドマップver</title>
  <style>
    body { font-family: 'Noto Sans JP', sans-serif; background: #f7f7f7; color: #222; margin: 0; padding: 1.5em;}
    h1, h2 { margin: 1em 0 0.5em; }
    .block { margin-bottom: 2em; padding: 1em; background: #fff; border-radius: 16px; box-shadow: 0 2px 10px #ddd4; }
    #ideaInput { width: 80%; padding: .5em; border-radius: 8px; border: 1px solid #aaa;}
    #addIdea { padding: .5em 1em; border-radius: 8px; background: #f0e68c; border: none; margin-left: .5em;}
    #treeContainer details { margin-bottom: .8em; border-left: 4px solid #aaf; background: #fafaff; border-radius: 8px;}
    summary { font-weight: bold; font-size: 1.06em; padding: .3em .8em;}
    .hotspot { border-left: 4px solid #f55 !important; background: #fff5f5 !important;}
    .question { margin: .4em 0 .2em 1.6em; }
    .question textarea.reply { width: 90%; margin-top: .3em; border-radius: 8px; border: 1px solid #ccc;}
    .mind-node {
      position: relative;
      display: inline-block;
      padding: .4rem .8rem;
      margin: .3rem;
      border: 1.5px solid #999;
      border-radius: 16px;
      background: #fff;
      cursor: move;
      font-weight: bold;
      user-select: none;
      transition: background 0.15s, border-color 0.15s;
      box-shadow: 2px 4px 8px #eee8;
    }
    .mind-node:hover {
      background: #ffd;
      border-color: #555;
      z-index: 2;
    }
    #mindMapArea {
      border: 1.5px dashed #aaa;
      min-height: 260px;
      padding: 1em;
      background: #fcfcfc;
      border-radius: 12px;
      margin-bottom: 1em;
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 0.5em;
    }
    #nodeInput { padding: .5em; border-radius: 8px; border: 1px solid #aaa; width: 60%;}
    #addNodeBtn { padding: .5em 1em; border-radius: 8px; background: #d1ebf5; border: none; margin-left: .5em;}
    @media (max-width: 700px) {
      #ideaInput, #nodeInput { width: 96%; }
      .block { padding: .5em; }
    }
  </style>
</head>
<body>
  <h1>銀魂式 思考拡張・ネタ帳</h1>

  <!-- 1. アイデア入力エリア -->
  <div class="block">
    <h2>💡 アイデア入力</h2>
    <input type="text" id="ideaInput" placeholder="思いつきをどんどん書き込め！" />
    <button id="addIdea">➕ 追加</button>
  </div>

  <!-- 2. 情報メモエリア -->
  <div class="block">
    <h2>📚 情報メモ</h2>
    <textarea id="infoMemo" rows="3" style="width:96%; border-radius:8px;" placeholder="#キーワード #根拠 など、記憶したい情報"></textarea>
  </div>

  <!-- 3. 思考ツリー表示（種別分類ラベル付） -->
  <div class="block">
    <h2>🤖 AIツッコミ＆思考ツリー（種別復活！）</h2>
    <div id="treeContainer"></div>
  </div>

  <!-- 4. 自由発想マインドマップ -->
  <div class="block">
    <h2>🧠 自由発想マインドマップ</h2>
    <div id="mindMapArea"></div>
    <input type="text" id="nodeInput" placeholder="ノードを追加..." />
    <button id="addNodeBtn">➕ 追加</button>
    <small>ドラッグ＆ドロップでノード並べ替えOK！（仮）</small>
  </div>

  <!-- 5. まとめ評価 -->
  <div class="block">
    <h2>🎤 まとめ＆スコア評価</h2>
    <div id="summaryBox" style="background:#f8f8ff; padding:1em; border-radius:12px;"></div>
    <button id="scoreBtn">📝 まとめてスコア評価</button>
  </div>

  <!-- 🧪 JS部（銀魂魂注入） -->
  <script>
    // ----【AIツッコミ用ダミーデータ】----
    const defaultQuestions = [
      "それって何でそう考えた？",
      "他の視点で見るとどう変わる？",
      "本当に必要な条件って何だ？"
    ];
    const devilsAdvocate = [
      "逆の立場から見たらどうなる？",
      "このままだと矛盾が生まれないか？",
      "弱点や抜け穴はないか？"
    ];
    const factKeywords = ["目的", "根拠", "背景", "事実", "理由", "効果"];

    // ----【ユーティリティ】----
    const rand = arr => arr[Math.floor(Math.random() * arr.length)];
    let summaryCollector = [];

    // ----【アイデア追加】----
    document.getElementById("addIdea").onclick = function() {
      const input = document.getElementById("ideaInput");
      const text = input.value.trim();
      if (!text) return;
      addIdeaToTree(text);
      input.value = "";
    };

    // ----【ツリー生成（種別ラベル付きdetails/summary）】----
    function addIdeaToTree(line) {
      const container = document.getElementById("treeContainer");
      const section = document.createElement("details");
      section.open = true;
      const summary = document.createElement("summary");
      summary.innerHTML = `📝 ${line}`;
      section.appendChild(summary);

      const categories = {
        "📌 発想を深める": [rand(defaultQuestions)],
        "🧱 論理を疑う": [rand(devilsAdvocate)],
        "📚 情報と照合": []
      };

      // 情報メモと矛盾チェック
      const infoMemo = document.getElementById("infoMemo").value;
      const memoTags = infoMemo.match(/#([^\s#]+)/g) || [];
      const lowerLine = line.toLowerCase();
      const contradiction = memoTags.find(k => !lowerLine.includes(k.toLowerCase().replace("#", "")));
      if (contradiction) {
        categories["📚 情報と照合"].push(`情報メモの「${contradiction}」と矛盾してない？`);
      }

      Object.entries(categories).forEach(([label, questions]) => {
        if (questions.length) {
          const cat = document.createElement("div");
          const catLabel = document.createElement("strong");
          catLabel.textContent = label;
          cat.appendChild(catLabel);

          questions.forEach(q => {
            const div = document.createElement("div");
            div.className = "question";
            div.textContent = "🤖 " + q;

            const replyBox = document.createElement("textarea");
            replyBox.rows = 2;
            replyBox.placeholder = "あなたの返答を書いてくれ…";
            replyBox.className = "reply";
            div.appendChild(replyBox);

            cat.appendChild(div);
          });
          section.appendChild(cat);
        }
      });

      if (Object.values(categories).flat().length >= 3)
        section.classList.add("hotspot");
      container.appendChild(section);
      summaryCollector.push(line);
    }

    // ----【マインドマップ：ドラッグ＆ドロップでノード追加・移動】----
    let mindNodes = [];
    const mindMapArea = document.getElementById("mindMapArea");

    function addMindNode(text) {
      if (!text) return;
      const node = document.createElement("div");
      node.textContent = text;
      node.className = "mind-node";
      node.style.background = `hsl(${Math.floor(Math.random()*360)}, 80%, 90%)`;
      node.setAttribute("draggable", "true");
      // DnD
      node.addEventListener("dragstart", e => {
        e.dataTransfer.setData("text/plain", text);
        node.classList.add("dragging");
      });
      node.addEventListener("dragend", e => {
        node.classList.remove("dragging");
      });
      node.addEventListener("drop", function(e) {
        e.preventDefault();
        let draggingNode = document.querySelector(".mind-node.dragging");
        if (draggingNode && draggingNode !== node) {
          mindMapArea.insertBefore(draggingNode, node.nextSibling);
        }
      });
      node.addEventListener("dragover", function(e) {
        e.preventDefault();
      });
      mindMapArea.appendChild(node);
      mindNodes.push(text);
    }

    document.getElementById("addNodeBtn").onclick = function() {
      const input = document.getElementById("nodeInput");
      const text = input.value.trim();
      addMindNode(text);
      input.value = "";
    };

    // ----【まとめ＆スコア評価（おまけ）】----
    document.getElementById("scoreBtn").onclick = function() {
      const ideas = summaryCollector;
      const nodes = Array.from(mindMapArea.children).map(n=>n.textContent);
      let evalScore = Math.round((ideas.length + nodes.length*1.2) * 7 + Math.random()*15);

      let comment = "まとめると…\n";
      comment += "・アイデア（思考ツリー）: " + ideas.length + "個\n";
      comment += "・発想ノード（マインドマップ）: " + nodes.length + "個\n";
      comment += "銀さん的ロジック度：" + evalScore + "点/100点！\n";
      comment += "…ま、オレ的には満点だけどな。繋げた分だけ宇宙も広がるってもんよ。";
      document.getElementById("summaryBox").textContent = comment;
    };

  </script>
</body>
</html>
